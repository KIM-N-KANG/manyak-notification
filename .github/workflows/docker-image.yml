name: Docker Image

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-notification

concurrency:
  group: notification-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 기본값은 packages:write 토큰을 .git/config에 남긴다. PR 실행은 브랜치가 제어하는
          # Gradle·Docker 빌드 코드를 돌리므로, 그 코드가 토큰을 주워 GHCR에 쓸 수 있게 된다.
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE}:${SHORT_SHA}"
            echo "${GHCR_IMAGE}:dev"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          tags: ${{ steps.image-tags.outputs.tags }}
