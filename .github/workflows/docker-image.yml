name: Docker Image

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-notification

jobs:
  build:
    name: Test and build image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 기본값은 packages:write 토큰을 .git/config에 남긴다. PR 실행은 브랜치가 제어하는
          # Gradle·Docker 빌드 코드를 돌리므로, 그 코드가 토큰을 주워 GHCR에 쓸 수 있게 된다.
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev, main 푸시는 GHCR :<sha7>로 올린다. 운영(OCI)은 GHCR :prod를 따라간다(KNK-2126). 수동 실행은 테스트와 빌드만 한다.
      # :dev, :prod 승격은 각 배포 잡의 최신 SHA 게이트 뒤에서 한다.
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image-tags
        run: echo "tags=${GHCR_IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # GitHub concurrency의 대기 슬롯은 하나다. 늦게 끝난 오래된 빌드가 최신 대기 잡을
  # 취소한 뒤 내부 게이트에서 스스로 skip하면 최신 커밋이 배포되지 않는다.
  # concurrency가 없는 사전 잡에서 오래된 실행을 걸러 배포 대기열에 들어가지 않게 한다.
  check-dev-head:
    name: Check latest dev SHA before queueing
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - name: Check latest dev SHA
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 실행을 배포 대기열에서 제외합니다"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  # dev 푸시(GHCR 갱신) 후 → :dev 승격. dev 환경이 :dev 다이제스트를 확인해 스스로 pull한다(KNK-2125).
  # 예전 EC2 앱 호스트 SSM 배포는 전환과 함께 뺐다.
  # 잡 이름은 체크 이름을 바꾸지 않으려고 그대로 둔다.
  deploy-dev:
    name: Deploy to app host (dev)
    needs: [build, check-dev-head]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.check-dev-head.outputs.latest == 'true'
    # :dev 승격을 직렬화한다(늦게 끝난 옛 실행이 태그를 되돌리지 않게).
    concurrency:
      group: manyak-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 큐에서 기다리는 동안 새 dev push가 올 수 있으므로 배포 직전에 최신 SHA를 다시 확인한다.
      - name: Gate - 최신 dev SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 최신 SHA 게이트를 통과한 뒤에만 :dev 를 이 커밋으로 옮긴다. 빌드 잡에서 붙이면
      # 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다. manifest 를 복사하므로
      # 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Promote ${{ github.sha }} to :dev
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "${GHCR_IMAGE}:dev" "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          echo "✅ :dev -> ${GITHUB_SHA::7}"

  # 오래된 빌드가 최신 배포의 concurrency 대기 슬롯을 밀어내지 않도록 큐 진입 전에 검사한다.
  check-main-head:
    name: Check latest main SHA before queueing
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - name: Check latest main SHA
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::최신 main($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 실행을 배포 대기열에서 제외합니다"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  # main 푸시 후 → GHCR :prod 를 이 커밋으로 옮기고, OCI 운영 호스트가 바꿔 띄울 시간을 기다린 뒤 공개 스모크 (KNK-2126).
  # CI 는 호스트에 명령을 보내지 않는다. 호스트의 updater(systemd 타이머, 앞 실행이 끝나고 60초 뒤 다시 돈다)가
  # :prod 다이제스트가 지금 이미지와 다르면 deploy.sh 로 배포한다. notification 은 들어오는 요청이 없어 프록시를 거치지 않는다:
  # 새 컨테이너가 Docker 헬스 healthy 가 되면 옛 것을 내린다(잠깐 둘이 함께 소비해도 Redis 처리 기록으로 중복 발송을 막는다).
  # 새 컨테이너가 헬스를 못 넘으면 옛 notification 이 계속 소비하고, 그 다이제스트는 실패로 기록돼 다시 시도하지 않는다.
  # 정본: manyak-terraform oci/prod/scripts/update.sh, oci/prod/deploy.sh
  deploy-prod:
    name: Deploy to app host (prod)
    needs: [build, check-main-head]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-main-head.outputs.latest == 'true'
    permissions:
      contents: read
      packages: write # GHCR :prod 이동
    # :prod 이동을 직렬화(큐잉)한다. 늦게 끝난 옛 실행이 :prod 를 되돌리지 않게 한다.
    concurrency:
      group: manyak-prod-notification-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 대기열에서 기다리는 동안 들어온 새 main push 는 그쪽 실행이 배포한다.
      - name: Gate - latest main SHA before deploy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::최신 main($LATEST_SHA)이 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.gate.outputs.latest == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.latest == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 지금 :prod 다이제스트를 남겨 두고(스모크가 실패하면 되돌릴 곳) :prod 를 이 커밋으로 옮긴다. 이것이 배포다.
      # 이 커밋의 빌드 잡이 :<sha7> 을 올린 뒤라 없으면 실패다. manifest 를 복사하므로 멀티아키 인덱스가 유지된다.
      - name: Move GHCR :prod to current SHA
        id: promote
        if: steps.gate.outputs.latest == 'true'
        run: |
          IMAGE="${GHCR_IMAGE}:${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$IMAGE" >/dev/null
          if PREV=$(docker buildx imagetools inspect "${GHCR_IMAGE}:prod" --format '{{.Manifest.Digest}}' 2>&1); then
            [[ "$PREV" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::지금 :prod 다이제스트를 읽지 못했습니다: $PREV"; exit 1; }
          elif printf '%s' "$PREV" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
            echo "::notice:::prod 가 아직 없습니다(첫 배포). 스모크가 실패해도 되돌릴 곳이 없습니다"
            PREV=""
          else
            echo "$PREV"; echo "::error::지금 :prod 조회가 매니페스트 부재가 아닌 이유로 실패했습니다. :prod 는 그대로입니다"; exit 1
          fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create --tag "${GHCR_IMAGE}:prod" "$IMAGE"
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "✅ GHCR :prod -> ${GITHUB_SHA::7} (직전 ${PREV:-없음})"

      # notification 은 공개 주소가 없어 CI 가 교체를 직접 볼 수 없다. updater 주기(약 1분)와 기동(약 30초)을 넉넉히
      # 기다린 뒤 공개 api 헬스로 운영이 살아 있는지 본다. 교체 성공과 실패는 updater 알림과 운영 로그로 확인한다.
      - name: Wait for OCI updater
        if: steps.promote.outputs.moved == 'true'
        run: sleep 180

      - name: Smoke test (api /actuator/health)
        if: steps.promote.outputs.moved == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::health 200/UP 확인 실패 — 운영 로그 확인"; exit 1

      # 스모크가 실패하면 :prod 를 직전 다이제스트로 되돌린다. updater 가 다음 주기에 직전 이미지로 다시 배포한다
      # (새 컨테이너가 처음부터 못 떴다면 지금 이미지와 같아 아무것도 하지 않는다). 완료는 기다리지 않는다 — 잡은 이미 실패다.
      - name: Roll back GHCR :prod on failure
        if: failure() && steps.promote.outputs.moved == 'true'
        env:
          PREV: ${{ steps.promote.outputs.prev }}
        run: |
          if [ -z "$PREV" ]; then
            echo "::warning::직전 :prod 가 없어 되돌리지 않았습니다. 운영 상태를 직접 확인하세요"; exit 0
          fi
          docker buildx imagetools create --tag "${GHCR_IMAGE}:prod" "${GHCR_IMAGE}@${PREV}"
          echo "::warning::스모크 실패로 GHCR :prod 를 직전 다이제스트($PREV)로 되돌렸습니다. updater 가 1~2분 안에 다시 배포합니다"
