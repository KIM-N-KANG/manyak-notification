name: Docker Image

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-notification
  ECR_REPOSITORY: manyak-notification
  AWS_REGION: ap-northeast-2
  # 운영 단일 EC2 앱 호스트(KNK-2106, manyak-terraform envs/prod/app-host.tf). 배포는 서비스별 SSM 문서로 한다.
  PROD_DEPLOY_DOCUMENT: manyak-prod-host-deploy-notification
  PROD_HOST_TAG: manyak-prod-host

jobs:
  build:
    name: Test and build image
    permissions:
      contents: read
      packages: write
      id-token: write # main push의 ECR 인증. AWS 역할 신뢰 정책은 main으로 제한한다.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 기본값은 packages:write 토큰을 .git/config에 남긴다. PR 실행은 브랜치가 제어하는
          # Gradle·Docker 빌드 코드를 돌리므로, 그 코드가 토큰을 주워 GHCR에 쓸 수 있게 된다.
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev 푸시는 GHCR만, main 푸시는 ECR과 GHCR에 같은 이미지를 올린다(KNK-2126, OCI 운영 호스트 전환 준비).
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials for ECR (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tags
        id: image-tags
        run: |
          # :dev 승격은 deploy-dev의 최신 SHA 게이트와 서비스 안정화 대기 뒤에 한다.
          SHORT_SHA="${GITHUB_SHA::7}"
          # 수동 실행은 기존처럼 테스트·빌드만 한다. ECR 인증·push는 main push 전용이다.
          # main push는 같은 빌드를 GHCR에도 올린다(한 번에 두 레지스트리라 다이제스트가 같다). OCI 운영 호스트는
          # GHCR :prod를 따라가고, 전환 전에는 아무도 GHCR 운영 이미지를 받지 않는다.
          {
            echo "tags<<EOF"
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${SHORT_SHA}"
            fi
            echo "${GHCR_IMAGE}:${SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # GitHub concurrency의 대기 슬롯은 하나다. 늦게 끝난 오래된 빌드가 최신 대기 잡을
  # 취소한 뒤 내부 게이트에서 스스로 skip하면 최신 커밋이 배포되지 않는다.
  # concurrency가 없는 사전 잡에서 오래된 실행을 걸러 배포 대기열에 들어가지 않게 한다.
  check-dev-head:
    name: Check latest dev SHA before queueing
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - name: Check latest dev SHA
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 실행을 배포 대기열에서 제외합니다"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  # dev 푸시(GHCR 갱신) 후 → :dev 승격. dev 환경이 :dev 다이제스트를 확인해 스스로 pull한다(KNK-2125).
  # 예전 EC2 앱 호스트 SSM 배포는 전환과 함께 뺐다.
  # 잡 이름은 체크 이름을 바꾸지 않으려고 그대로 둔다.
  deploy-dev:
    name: Deploy to app host (dev)
    needs: [build, check-dev-head]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.check-dev-head.outputs.latest == 'true'
    # :dev 승격을 직렬화한다(늦게 끝난 옛 실행이 태그를 되돌리지 않게).
    concurrency:
      group: manyak-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 큐에서 기다리는 동안 새 dev push가 올 수 있으므로 배포 직전에 최신 SHA를 다시 확인한다.
      - name: Gate - 최신 dev SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 최신 SHA 게이트를 통과한 뒤에만 :dev 를 이 커밋으로 옮긴다. 빌드 잡에서 붙이면
      # 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다. manifest 를 복사하므로
      # 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Promote ${{ github.sha }} to :dev
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "${GHCR_IMAGE}:dev" "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          echo "✅ :dev -> ${GITHUB_SHA::7}"

  # 오래된 빌드가 최신 배포의 concurrency 대기 슬롯을 밀어내지 않도록 큐 진입 전에 검사한다.
  check-main-head:
    name: Check latest main SHA before queueing
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - name: Check latest main SHA
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::최신 main($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 실행을 배포 대기열에서 제외합니다"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  # main 푸시(ECR 갱신) 후 → 운영 앱 호스트에 SSM 문서로 배포 + 헬스 스모크 (KNK-2106, 예전 ECS 는 KNK-963)
  deploy-prod:
    name: Deploy to app host (prod)
    needs: [build, check-main-head]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-main-head.outputs.latest == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write # GHCR :prod 이동(KNK-2126)
    # 취소보다 큐잉이 안전하다(호스트로 보낸 배포 명령은 잡을 취소해도 되돌릴 수 없다). 세 앱 레포 사이의
    # 직렬화는 호스트의 deploy.sh 가 flock 으로 한다(예전 "Wait for active service to settle" 단계가 하던 일).
    concurrency:
      group: manyak-prod-notification-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 대기열에서 기다리는 동안 들어온 새 main push 는 그쪽 실행이 배포한다.
      - name: Gate - latest main SHA before deploy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::최신 main($LATEST_SHA)이 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      # 운영 앱 호스트의 deploy.sh 를 SSM 문서(manyak-prod-host-deploy-notification)로 부른다(KNK-2106).
      # notification 은 들어오는 요청이 없어 프록시를 거치지 않는다: 새 컨테이너가 Docker 헬스 healthy 가 되면 옛 것을
      # 내린다(잠깐 둘이 함께 SQS 를 소비해도 Redis 처리 기록으로 중복 발송을 막는다). 헬스를 못 넘으면 새 컨테이너를
      # 지우고 실패로 끝나며 옛 notification 이 계속 소비한다. 불변 태그(:<sha7>)로 배포하고, 호스트가 현재·직전 이미지를
      # 기록한다(image=rollback 으로 되돌림). 배포 확인: 예전의 배포 id·태스크 헬스 대조 대신, deploy.sh 가 끝에 찍는
      # "deployed <image>" 줄이 요청한 이미지인지 본다.
      - name: Deploy to prod app host (SSM)
        id: deploy
        if: steps.gate.outputs.latest == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker buildx imagetools inspect "$IMAGE" >/dev/null
          CID=$(aws ssm send-command --document-name "$PROD_DEPLOY_DOCUMENT" \
            --targets "Key=tag:manyak:host,Values=$PROD_HOST_TAG" --parameters "image=$IMAGE" \
            --timeout-seconds 600 --query Command.CommandId --output text)
          echo "SSM 명령 $CID ($IMAGE)"
          # 기동(약 1분)과 다른 레포 배포의 잠금 대기(server 드레인 최대 240초 포함)까지 넉넉히 기다린다(최대 30분).
          IID=""
          for i in $(seq 1 180); do
            sleep 10
            if [ -z "$IID" ] || [ "$IID" = "None" ]; then
              IID=$(aws ssm list-command-invocations --command-id "$CID" --query 'CommandInvocations[0].InstanceId' --output text)
              [ -n "$IID" ] && [ "$IID" != "None" ] || { echo "명령 전달 대기 $i"; continue; }
            fi
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text)
            case "$STATUS" in
              Pending|InProgress|Delayed) echo "배포 $STATUS — 대기 $i/180 (10s)" ;;
              *) break ;;
            esac
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true)
          echo "$OUT"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::운영 앱 호스트 배포가 $STATUS 로 끝났습니다. 옛 notification 이 계속 소비합니다. 위 출력과 CloudWatch /manyak/prod/app-host 확인"
            exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -qF "notification: deployed $IMAGE as "; then
            echo "::error::배포 명령은 성공했지만 출력에서 'deployed $IMAGE' 를 찾지 못했습니다 — 호스트의 /data/state/notification.image 확인"
            exit 1
          fi
          echo "✅ 운영 앱 호스트 배포 완료: $IMAGE"

      # 배포가 끝난 뒤에만 :latest 를 옮긴다. 호스트는 불변 태그로 배포하므로 :latest 는 호스트 기록이 없을 때의
      # 기본값과 옛 ECS 로 되돌릴 때 쓰인다. 실패한 배포는 :latest 를 건드리지 않아 예전의 ":latest 복구" 단계가 필요 없다.
      - name: Promote current SHA to :latest
        if: steps.gate.outputs.latest == 'true'
        run: |
          docker buildx imagetools create --tag "${IMAGE%:*}:latest" "$IMAGE"
          echo "✅ :latest -> ${GITHUB_SHA::7}"

      # AWS 배포가 성공한 이미지만 GHCR :prod 로 옮긴다(KNK-2126). OCI 운영 호스트의 updater 가 :prod 다이제스트를 따라
      # 배포한다. 전환 전에는 아무도 :prod 를 받지 않아 영향이 없다. 직렬화 구간 안이라 옛 실행이 태그를 되돌리지 않는다.
      # 이 변경 전에 빌드된 커밋은 GHCR 에 :<sha7> 이 없어 건너뛴다(실패 아님). 그 밖의 조회 실패는 실패로 남긴다.
      # 되돌리기는 수동 워크플로 prod-rollback.yml 이 :prod 를 입력 sha 로 옮긴다.
      - name: Promote current SHA to GHCR :prod
        if: steps.gate.outputs.latest == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SOURCE="${GHCR_IMAGE}:${GITHUB_SHA::7}"
          if ! OUT=$(docker buildx imagetools inspect "$SOURCE" 2>&1); then
            echo "$OUT"
            if printf '%s' "$OUT" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
              echo "::notice::GHCR 에 $SOURCE 가 없어 :prod 를 옮기지 않습니다(이 변경 전에 빌드된 커밋)"
              exit 0
            fi
            echo "::error::GHCR 이미지 조회가 매니페스트 부재가 아닌 이유로 실패했습니다. :prod 는 그대로입니다(AWS 배포는 끝남)"
            exit 1
          fi
          docker buildx imagetools create --tag "${GHCR_IMAGE}:prod" "$SOURCE"
          echo "✅ GHCR :prod -> ${GITHUB_SHA::7}"
