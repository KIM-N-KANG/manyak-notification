spring:
  cloud:
    aws:
      sqs:
        # local과 기본 테스트에서는 AWS 클라이언트와 폴링 컨테이너를 생성하지 않는다.
        enabled: false
  data:
    redis:
      connect-timeout: 1s
      timeout: 1s
  application:
    name: manyak-notification

server:
  port: 8080

management:
  otlp:
    metrics:
      export:
        # 기본 off다. 추적 스타터가 가져오는 OTLP 메트릭의 기본 URL은 localhost:4318/v1/metrics라,
        # 켜 두면 모든 프로파일에서 매 전송 주기마다 localhost로 헛전송한다.
        # endpoint·인증 헤더를 먼저 주입한 뒤 이 토글을 켠다.
        enabled: ${MANYAK_OTLP_METRICS_ENABLED:false}
  tracing:
    export:
      enabled: ${MANYAK_TRACING_ENABLED:false}
      otlp:
        enabled: ${MANYAK_TRACING_ENABLED:false}
    sampling:
      probability: ${MANYAK_TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANYAK_OTLP_TRACES_ENDPOINT:}
          transport: http
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Boot 4의 기본 probe 그룹을 꺼서 응답을 status 하나로 유지한다.
      probes:
        enabled: false
  prometheus:
    metrics:
      export:
        # 스크레이프 엔드포인트는 무인증이라 기본은 끈다. 로컬 compose만 application-local.yml에서 켠다.
        enabled: false

manyak:
  internal:
    shared-secret: ${MANYAK_INTERNAL_SHARED_SECRET:}
  server:
    internal-base-url: ${MANYAK_SERVER_INTERNAL_BASE_URL:}
  push:
    queue-url: ${MANYAK_PUSH_QUEUE_URL:}
    fcm:
      service-account-json: ${MANYAK_FCM_SERVICE_ACCOUNT_JSON:}
    web-base-url: ${MANYAK_PUSH_WEB_BASE_URL:https://manyak.app}
    web:
      icon-url: ${MANYAK_PUSH_WEB_ICON_URL:https://manyak.app/icons/icon-192.png}

---
spring:
  config:
    activate:
      on-profile: dev | prod
  cloud:
    aws:
      # dev/prod 큐는 서울 리전에 있다. 자격증명은 SDK 기본 체인으로 ECS 태스크 역할을 사용한다.
      region:
        static: ap-northeast-2
      sqs:
        enabled: true
        observation-enabled: true
        queue-not-found-strategy: FAIL
